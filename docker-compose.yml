services:
  mystic-forge:
    build: .
    container_name: mystic_forge
    ports:
      - "8000:8000"
    environment:
      - MYSTIC_FORGE_DB=/data/mystic_forge.db
      # Hosted goldfish run reports (optional). Set BOTH to serve reports at
      # {GOLDFISH_PUBLIC_BASE_URL}/goldfish/r/<run_code>; set only the DIR to
      # persist HTML without advertising links. Unset: reports stay in-memory
      # (goldfish_report tool only).
      # - GOLDFISH_REPORT_DIR=/data/goldfish-reports
      # - GOLDFISH_PUBLIC_BASE_URL=https://example.com
    volumes:
      - mystic_forge_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always

volumes:
  mystic_forge_data:
