services:
  mystic-forge:
    build: .
    container_name: mystic_forge
    ports:
      - "8000:8000"
    restart: always
    # Hosted goldfish run reports (optional). Set BOTH to serve reports at
    # {GOLDFISH_PUBLIC_BASE_URL}/goldfish/r/<run_code>; set only the DIR to
    # persist HTML without advertising links. Unset: reports stay in-memory
    # (goldfish_report tool only).
    # environment:
    #   GOLDFISH_REPORT_DIR: /data/goldfish-reports
    #   GOLDFISH_PUBLIC_BASE_URL: https://example.com
    # volumes:
    #   - ./goldfish-reports:/data/goldfish-reports
