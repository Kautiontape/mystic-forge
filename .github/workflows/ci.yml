name: CI

# Tests only. Pushing to this repo does NOT deploy — releases happen by bumping
# the submodule pin in Kautiontape/mcp-servers (see propose-release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate VERSION
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$version"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::'$version' is not X.Y.Z semver"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q -m "not slow"
