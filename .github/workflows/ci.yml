name: CI

# Tests only. Pushing to this repo does NOT deploy — releases happen by bumping
# the submodule pin in Kautiontape/mcp-servers. A green run on main triggers
# propose-release.yml, which raises that PR; a red run proposes nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate VERSION
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$version"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::'$version' is not X.Y.Z semver"
            exit 1
          fi

      # A release is only proposable when its changelog entry ships with it.
      # scripts/render_release.py in mcp-servers transcribes this fragment
      # into the landing pages when propose-release opens the PR, so catching
      # a missing or mistagged fragment here — where the author is — is what
      # keeps the release PR from ever opening red.
      - name: Validate changelog fragment
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          fragment="changelog.d/${version}.html"
          if [ ! -f "$fragment" ]; then
            echo "::error file=VERSION::VERSION is ${version} but ${fragment} does not exist; write the changelog entry in the same change as the bump (see changelog.d/README.md)"
            exit 1
          fi
          if ! grep -q "<article class=\"entry\" data-version=\"${version}\">" "$fragment"; then
            echo "::error file=${fragment}::no <article class=\"entry\" data-version=\"${version}\"> block"
            exit 1
          fi
          stray=$(grep -o 'data-version="[^"]*"' "$fragment" | grep -v "\"${version}\"" || true)
          if [ -n "$stray" ]; then
            echo "::error file=${fragment}::article tagged ${stray} in the ${version} fragment"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q -m "not slow"
