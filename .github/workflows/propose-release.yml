name: propose release

# Opens (or updates) a PR in Kautiontape/mcp-servers bumping this repo's
# submodule pin. Merging that PR is what deploys — this workflow never touches
# production itself.
#
# Runs after CI succeeds on main (not on push) so a version bump whose tests
# fail cannot be proposed for release — the parent repo's release checks never
# run this repo's test suite, so this is the only test gate in the chain.
#
# Only proposes when VERSION differs from the version at the current pin, so
# docs- and CI-only pushes do not raise a release PR that would then fail the
# "version increased" check.
#
# The release branch is derived state, rebuilt from origin/main every run:
# the pin bump, the changelog entry, the teaser, and any new tool tags are
# all rendered from this repo's changelog.d/ fragments by
# mcp-servers/scripts/render_release.py, and check_release.py must pass
# before anything is pushed. A release PR therefore opens with its checks
# already green — if rendering or the checks fail, this run fails instead,
# here, where the fragment is fixed. Do not hand-edit the release branch;
# edit changelog.d/ and re-push.
#
# Requires the repo secret MCP_SERVERS_RELEASE_TOKEN: a fine-grained PAT owned by
# the Kautiontape org, scoped to Kautiontape/mcp-servers only, with
# Contents: read+write and Pull requests: read+write. The built-in GITHUB_TOKEN
# is repo-scoped and cannot write to another repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: propose-release
  cancel-in-progress: false

permissions: {}

jobs:
  propose:
    # workflow_run fires for every CI completion; only a successful run of a
    # main push may propose. Manual dispatch proposes the tip of main as-is.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Kautiontape/mcp-servers
      RELEASE_BRANCH: release/mystic-forge
      NEW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out mcp-servers
        uses: actions/checkout@v4
        with:
          repository: Kautiontape/mcp-servers
          token: ${{ secrets.MCP_SERVERS_RELEASE_TOKEN }}
          fetch-depth: 0
          submodules: recursive
          path: mcp-servers

      # The same interpreter release-checks.yml uses, so the pre-flight here
      # and the gate on the PR cannot disagree about the scripts they share.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build the release branch
        id: bump
        working-directory: mcp-servers
        run: |
          set -euo pipefail

          OLD_SHA=$(git ls-tree HEAD mystic-forge | awk '{print $3}')
          echo "current pin: $OLD_SHA"
          echo "proposed:    $NEW_SHA"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pin is already current; nothing to propose."
            exit 0
          fi

          git -C mystic-forge fetch origin

          OLD_VERSION=$(git -C mystic-forge show "${OLD_SHA}:VERSION" 2>/dev/null \
            | tr -d '[:space:]' || true)
          NEW_VERSION=$(git -C mystic-forge show "${NEW_SHA}:VERSION" \
            | tr -d '[:space:]')
          echo "version: ${OLD_VERSION:-none} -> ${NEW_VERSION}"

          # A release is a version change. Without this, every docs or CI push
          # would raise a PR that fails the "version increased" check, and red
          # checks you are meant to ignore are worse than no checks.
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VERSION is unchanged at ${NEW_VERSION}; not proposing a release."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch is rebuilt from main every run. Everything on it is
          # derived from the pin and changelog.d/, so there is nothing
          # hand-written to preserve — a stale or squash-merged branch state
          # is simply discarded.
          git checkout -B "$RELEASE_BRANCH" origin/main
          git -C mystic-forge checkout --detach "$NEW_SHA"

          # Transcribe changelog.d/ fragments into the landing pages: the
          # changelog entry, the teaser, and any new tool tags or groups.
          python3 scripts/render_release.py

          git add mystic-forge landing
          if git diff --cached --quiet; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release branch already matches $NEW_SHA."
            exit 0
          fi
          git commit -m "mystic-forge: Release ${NEW_VERSION} (${NEW_SHA:0:7})"

          # Pre-flight the same checks the PR will run. A failure stops this
          # run before anything is pushed, so the release PR can never open
          # red — fix the fragment in changelog.d/ and push again.
          python3 scripts/check_release.py --base origin/main

          git push --force-with-lease origin "$RELEASE_BRANCH"

          {
            echo "skip=false"
            echo "version=$NEW_VERSION"
            echo "old_sha=$OLD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.bump.outputs.skip == 'false'
        working-directory: mcp-servers
        env:
          GH_TOKEN: ${{ secrets.MCP_SERVERS_RELEASE_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          OLD_SHA: ${{ steps.bump.outputs.old_sha }}
        run: |
          set -euo pipefail

          {
            printf 'Bumps the `mystic-forge` pin to `%s` (version **%s**).\n\n' "$NEW_SHA" "$VERSION"
            printf 'Merging this deploys. Nothing reaches production until then.\n\n'
            printf '### Commits\n\n'
            git -C mystic-forge log --format='- %s' "${OLD_SHA}..${NEW_SHA}" \
              || printf -- '- (range unavailable)\n'
            printf '\n### Release checks\n\n'
            printf 'Passed when this branch was built: the changelog entry, teaser, and\n'
            printf 'tool tags were rendered from `mystic-forge/changelog.d/%s.html` by\n' "$VERSION"
            printf '`scripts/render_release.py`.\n\n'
            printf 'This branch is rebuilt from `main` on every proposal — to change the\n'
            printf 'entry, edit the fragment in mystic-forge and push; do not commit here.\n'
          } > /tmp/pr-body.md

          # Match OPEN pull requests only. `gh pr view <branch>` resolves by head
          # branch name and happily returns a merged PR, and GitHub accepts
          # title/body edits on merged PRs -- so the obvious version of this
          # silently rewrites the last release's description and never opens a
          # new one.
          OPEN_PR=$(gh pr list --repo "$TARGET_REPO" --head "$RELEASE_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -n "$OPEN_PR" ]; then
            echo "Updating open PR #${OPEN_PR}."
            gh pr edit "$OPEN_PR" --repo "$TARGET_REPO" \
              --title "mystic-forge: Release ${VERSION}" \
              --body-file /tmp/pr-body.md
          else
            echo "No open release PR; creating one."
            gh pr create --repo "$TARGET_REPO" \
              --base main --head "$RELEASE_BRANCH" \
              --title "mystic-forge: Release ${VERSION}" \
              --body-file /tmp/pr-body.md
          fi
